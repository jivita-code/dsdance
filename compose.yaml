services:
  website:
    image: jivita/dsdance:latest
    build: .
    env_file: .env
    ports:
      - "${WEBSITE_BIND_ADDRESS:-0.0.0.0}:${WEBSITE_PORT:-3001}:3001"
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
